function normalizeDB(raw) {
  const base =
    raw && typeof raw === "object"
      ? raw
      : {
          ...Object.fromEntries(RECORD_TYPES.map((k) => [k, []])),
          activity: [],
          emailDrafts: [],
          employmentHistory: [],
          notes: [],
          attachments: [],
          savedViews: [],
          preferences: {},
          preferenceVersion: 0,
        };
  for (const k of RECORD_TYPES) {
    if (!Array.isArray(base[k])) base[k] = [];
    base[k] = base[k]
      .filter(
        (x) => x && typeof x.id === "string" && typeof x.name === "string",
      )
      .map((x) => ({
        ...x,
        ownerId: String(x.ownerId || ""),
        visibility: x.visibility === "private" ? "private" : "shared",
        entityType: k,
        contactIds: Array.isArray(x.contactIds) ? x.contactIds : [],
        history: Array.isArray(x.history) ? x.history : [],
      }));
  }
  if (!Array.isArray(base.activity)) base.activity = [];
  if (!Array.isArray(base.emailDrafts)) base.emailDrafts = [];
  if (!Array.isArray(base.employmentHistory)) base.employmentHistory = [];

  return base;
}

function chartLegend() {

        : "service";

function chartGradient() {
  const rows = recordsFor("Opportunities", "Home");

    chartTab === "By Stage"
      ? "status"
      : chartTab === "By Region"
        ? "region"
        : "service";
  const values = rows.reduce((a, x) => {
    a[x[key] || "Other"] = (a[x[key] || "Other"] || 0) + 1;
    return a;
  }, {});
  const names =
    chartTab === "By Stage" ? statuses.Opportunities : Object.keys(values);
  let pos = 0;
  const colors = [
    "#686456",
    "#8b957f",
    "#ead8bd",
    "#c4c9b7",
    "#a1ad95",
    "#dedbd3",
  ];
  return (
    "conic-gradient(" +
    names
      .map((name, i) => {
        let start = pos;
        pos += ((values[name] || 0) / rows.length) * 100;

function trashPage() {
  if (!isManager()) return '<div class="empty">Access restricted.</div>';
  const rows = RECORD_TYPES.flatMap((k) =>
    db[k]
      .filter((x) => x.deletedAt && canRead(x) && inScope(x))
      .map((x) => ({ ...x, type: k })),
  ).filter((x) => normal(x.name + " " + x.company).includes(normal(query)));
  return `<div class="welcome"><div><h1>Trash</h1><div class="subtitle">Deleted records remain here until you restore or permanently delete them.</div></div></div><div class="toolbar"><input id="listsearch" placeholder="Search deleted records..." value="${esc(query)}"></div><section class="panel tablewrap"><table class="table"><thead><tr><th>Record</th><th>Type</th><th>Deleted</th><th>Owner</th><th>Actions</th></tr></thead><tbody>${rows.map((x) => `<tr><td>${esc(x.name)}<br><small class="muted">${esc(x.company)}</small></td><td>${x.type}</td><td>${fullDate(x.deletedAt)}</td><td>${esc(userName(x.ownerId))}</td><td><button class="secondary" data-restore="${x.type}" data-id="${esc(x.id)}">Restore</button> <button class="secondary dangertext" data-purge="${x.type}" data-id="${esc(x.id)}">Delete permanently</button></td></tr>`).join("")}</tbody></table>${rows.length ? "" : '<div class="empty">Trash is empty.</div>'}</section>`;
}

      draft.email = (draft.email || "").trim();

function findDuplicates(draft, exclude) {
  const phone = (s) => String(s || "").replace(/\D/g, "");
  return db.Contacts.filter(
    (x) => !x.deletedAt && canRead(x) && x.id !== exclude,
  )
    .map((x) => {
      const reasons = [];
      if (draft.email && x.email && normal(draft.email) === normal(x.email))
        reasons.push("same email");
      if (
        phone(draft.phone).length >= 7 &&
        phone(draft.phone) === phone(x.phone)
      )
        reasons.push("same phone");
      if (
        normal(draft.name) === normal(x.name) &&
        normal(draft.company) === normal(x.company)
      )
        reasons.push("same name and company");
      return { record: x, reasons };
    })
    .filter((x) => x.reasons.length);
}
function duplicateDialog(k, id, draft, matches) {
  const d = showDialog(
    `<h2>Possible duplicate contact</h2><p class="notice">We found ${matches.length} existing contact${matches.length === 1 ? "" : "s"}. Update an existing contact or continue with a separate record.</p><div class="duplicatechoices">${matches.map(({ record: x, reasons }, i) => `<label class="duplicate"><input type="radio" name="duplicate" value="${esc(x.id)}" ${i === 0 ? "checked" : ""}><span><b>${esc(x.name)}</b><small>${esc(x.company)} · ${esc(x.email)}</small><small>Match: ${esc(reasons.join(", "))}</small></span></label>`).join("")}</div><div class="formbuttons wrap"><button class="secondary" id="backduplicate">Back</button><button class="secondary" id="continueDuplicate">Continue Anyway</button><button class="primary" id="updateDuplicate">Update Existing</button></div>`,
  );
  d.querySelector("#backduplicate").onclick = () => openForm(k, id, "", draft);
  d.querySelector("#continueDuplicate").onclick = async () =>
    await commitRecord(k, id, draft);
  d.querySelector("#updateDuplicate").onclick = () => {
    const target = d.querySelector("input[name=duplicate]:checked")?.value;
    const old = visibleRecord("Contacts", target);
    if (!old) return toast("Record no longer available");
    const merged = { ...old };
    for (const [key, value] of Object.entries(draft)) {
      if (["id", "ownerId", "visibility", "history"].includes(key)) continue;
      if (value !== "" && value !== undefined) merged[key] = value;
    }
    openForm("Contacts", target, "", merged);
  };
}
async function commitRecord(k, id, draft) {
  if (
    (draft.contactIds || []).some((c) => !visibleRecord("Contacts", c)) ||
    (draft.opportunityId &&
      !visibleRecord("Opportunities", draft.opportunityId))
  )
    return toast("A linked record is no longer available");
  const old = id ? visibleRecord(k, id) : null;
  if (id && !old) return toast("Record no longer available");
  const owned = old ? old.ownerId === user.id : true;
  const allowVisibility =
    isManager() && owned && ["Contacts", "Opportunities"].includes(k);
  const record = {
    ...old,
    ...draft,
    entityType: k,
    id: id || crypto.randomUUID(),
    ownerId: old?.ownerId || user.id,
    visibility: allowVisibility
      ? draft.visibility === "private"
        ? "private"
        : "shared"
      : old?.visibility || "shared",
    createdAt: old ? old.createdAt || null : Date.now(),
    updatedAt: Date.now(),
    history: [...(old?.history || [])],
  };
  if (old) {
    const { history, ...before } = old;
    record.history.push({ at: Date.now(), actorId: user.id, before });
  }
  if (
    !(await transact((next) => {
      if (
        old &&
        k === "Contacts" &&
        (normal(old.company) !== normal(record.company) ||
          normal(old.jobTitle) !== normal(record.jobTitle)) &&
        (old.company || old.jobTitle)
      ) {
        next.employmentHistory.push({
          id: crypto.randomUUID(),
          contactId: old.id,
          company: old.company || "",
          jobTitle: old.jobTitle || "",
          department: old.department || "",
          startDate: "",
          endDate: new Date(Date.now() + 3 * 3600000)
            .toISOString()
            .slice(0, 10),
          notes:
            "Previous role recorded automatically when profile changed. Original start date not recorded.",
          ownerId: old.ownerId,
          visibility: old.visibility,
          createdAt: Date.now(),
          updatedAt: Date.now(),
        });
      }
      if (id) next[k] = next[k].map((x) => (x.id === id ? record : x));
      else next[k].push(record);
      addLog(next, `${singular(k)} ${id ? "updated" : "added"}`, record, k);
    }))
  )
    return;
  closeDialog();
  render();
  toast("Saved successfully");
}
function confirmDelete(k, id, permanent = false) {
  if (!isManager())
    return toast("Only the General Manager can delete records.");
  if (!RECORD_TYPES.includes(k)) return;
  const record = db[k].find((x) => x.id === id && canRead(x));
  if (!record || (permanent ? !record.deletedAt : record.deletedAt))
    return toast("Record is not available.");
  const title = permanent ? "Delete permanently?" : "Move to Trash?";
  const d = showDialog(
    `<h2>${title}</h2><p>${esc(record.name)}</p><p class="smallnote">${permanent ? "This permanently removes the record, its profile notes, attached files and email drafts." : "The record will be hidden from active pages. You can restore it from Trash."}</p><div class="formbuttons"><button class="secondary" id="cancel">Cancel</button><button class="primary" id="firstconfirm">Continue</button></div>`,
  );
  d.querySelector("#cancel").onclick = closeDialog;
  d.querySelector("#firstconfirm").onclick = () => {
    d.innerHTML = `<h2>Confirm ${permanent ? "permanent deletion" : "deletion"}</h2><p>Type <b>DELETE</b> to confirm.</p><label class="formfield">Confirmation<input id="deleteword" autocomplete="off"></label><div class="formbuttons"><button class="secondary" id="cancel">Cancel</button><button class="primary" id="confirmdelete" disabled>${permanent ? "Delete permanently" : "Move to Trash"}</button></div>`;
    d.querySelector("#cancel").onclick = closeDialog;
    d.querySelector("#deleteword").oninput = (e) =>
      (d.querySelector("#confirmdelete").disabled =
        e.target.value !== "DELETE");
    d.querySelector("#confirmdelete").onclick = async () => {
      if (!isManager() || d.querySelector("#deleteword").value !== "DELETE")
        return;
      const done = await transact((next) => {
        if (permanent) {
          next[k] = next[k].filter((x) => x.id !== id);
          next.notes = (next.notes || []).filter(
            (x) => !(x.recordType === k && x.recordId === id),
          );
          next.attachments = (next.attachments || []).filter(
            (x) => !(x.recordType === k && x.recordId === id),
          );
          next.activity = next.activity.filter(
            (x) => !(x.recordType === k && x.recordId === id),
          );
          if (k === "Opportunities")
            next.emailDrafts = next.emailDrafts.filter(
              (x) => x.opportunityId !== id,
            );
          if (k === "Contacts")
            next.employmentHistory = next.employmentHistory.filter(
              (x) => x.contactId !== id,
            );
        } else {
          const x = next[k].find((x) => x.id === id);
          x.deletedAt = Date.now();
          x.deletedBy = user.id;
          addLog(next, "Record moved to Trash", x, k);
        }
      });
      if (done) {
        closeDialog();
        render();
        toast(permanent ? "Record permanently deleted" : "Moved to Trash");
        if (!permanent && typeof showUndoDelete === "function")
          showUndoDelete(k, id);
      }
    };
  };
}
async function restoreRecord(k, id) {
  if (!isManager() || !RECORD_TYPES.includes(k))
    return toast("Only the General Manager can restore records.");
  const x = db[k].find((x) => x.id === id && x.deletedAt && canRead(x));
  if (!x) return;
  const done = await transact((next) => {
    const record = next[k].find((x) => x.id === id);
    delete record.deletedAt;
    delete record.deletedBy;
    record.updatedAt = Date.now();
    addLog(next, "Record restored", record, k);
  });
  if (done) {
    render();
    toast("Record restored");
  }
}
function download(name, data, type) {
  const u = URL.createObjectURL(new Blob([data], { type }));
  const a = document.createElement("a");
  a.href = u;
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(u), 1000);
}

    return toast("Only the General Manager can export.");

    "name",
    "company",

    "region",

    "ownerId",
    "visibility",

  ];

}
function calendar(id) {
  const x = visibleRecord("Meetings", id);
  if (!x) return;
  if (!x.date) return toast("Set a meeting date first");
  const clean = (s) =>
    String(s || "")
      .replace(/\\/g, "\\\\")
      .replace(/\n/g, "\\n")
      .replace(/,/g, "\\,")
      .replace(/;/g, "\\;");
  const dt = (t) =>
    x.date.replaceAll("-", "") + "T" + (t || "09:00").replace(":", "") + "00";
  download(
    "DGJ-meeting.ics",
    [
      "BEGIN:VCALENDAR",
      "VERSION:2.0",
      "PRODID:-//DGJ//CRM Demo//EN",
      "BEGIN:VEVENT",
      "UID:" + x.id + "@dgj-demo",
      "DTSTAMP:" +
        new Date()
          .toISOString()
          .replace(/[-:]/g, "")
          .replace(/\.\d{3}/, ""),
      "DTSTART;TZID=Asia/Riyadh:" + dt(x.time),
      "DTEND;TZID=Asia/Riyadh:" + dt(x.end),
      "SUMMARY:" + clean(x.name),
      "LOCATION:" + clean(x.company),
      "DESCRIPTION:" + clean(x.notes),
      "END:VEVENT",
      "END:VCALENDAR",
    ].join("\r\n"),
    "text/calendar",
  );
}
function validEmail(email) {
  return /^[^\s@,;<>]+@[^\s@,;<>]+\.[^\s@,;<>]+$/.test(email);
}
function parseRecipients(value) {
  return [
    ...new Set(
      String(value || "")
        .split(/[;,\n]+/)
        .map((x) => x.trim().toLowerCase())
        .filter(Boolean),
    ),
  ];
}

function linkedAccess(x) {

      x.recordId) ||
    x.contactId;
  if (!inheritsParent && !BASE_READ(x)) return false;
  if (x.recordType === "Contacts" || x.recordType === "Opportunities") {
    const parent = db[x.recordType]?.find((r) => r.id === x.recordId);
    if (!parent || parent.deletedAt || !BASE_READ(parent)) return false;
  }
  if (x.opportunityId) {
    const p = db.Opportunities.find((r) => r.id === x.opportunityId);
    if (!p || p.deletedAt || !BASE_READ(p)) return false;
  }
  for (const id of Array.isArray(x.contactIds) ? x.contactIds : []) {
    const p = db.Contacts.find((r) => r.id === id);
    if (!p || p.deletedAt || !BASE_READ(p)) return false;
  }
  if (x.contactId) {
    const p = db.Contacts.find((r) => r.id === x.contactId);
    if (!p || p.deletedAt || !BASE_READ(p)) return false;
  }

}

function pipelineHTML(rows, x = null) {
  return `<div class="pipeline">${STAGES.map((stage, i) => {
    const isCurrent = x?.status === stage;
    let value = rows ? rows.filter((o) => o.status === stage).length : "";
    if (x) {
      const intervals = stageIntervals(x).filter((h) => h.stage === stage);
      const n = intervals.reduce(
        (s, h) => s + (dayDiff(h.start, h.end || todayISO()) || 0),
        0,
      );
      value = intervals.length
        ? n + " days"
        : isCurrent && stageDuration(x) !== null
          ? stageDuration(x) + " days"
          : "—";
    }
    return `<button class="pipeline-stage ${isCurrent ? "current" : ""}" style="--stage-color:${STAGE_COLORS[i]}" ${rows ? `data-chart-filter="status" data-kind="Opportunities" data-value="${stage}"` : `data-change-stage="${stage}" data-id="${esc(x.id)}"`}><span>${STAGE_LABELS[i]}</span><b>${value}</b></button>`;
  }).join("")}</div>`;
}
function stageIntervals(x) {
  if (Array.isArray(x.stageHistory) && x.stageHistory.length)
    return x.stageHistory;
  const changes = (x.history || [])
      .filter((h) => h.before?.status)
      .sort((a, b) => a.at - b.at),
    out = [];
  let start = oppStart(x),
    stage = changes[0]?.before.status || x.status;
  for (let i = 0; i < changes.length; i++) {
    const h = changes[i],
      nextStage = changes[i + 1]?.before.status || x.status,
      date = new Date(h.at + 3 * 3600000).toISOString().slice(0, 10);
    if (nextStage !== stage) {
      out.push({ stage, start, end: date });
      stage = nextStage;
      start = date;
    }
  }
  if (start)
    out.push({
      stage,
      start,
      end: ["Won", "Lost"].includes(x.status) ? x.closedDate || "" : "",
    });
  return out;
}
function durationTimeline(rows) {
  const data = rows
    .filter((x) => oppStart(x))
    .sort((a, b) =>
      ui.timelineSort === "name"
        ? a.name.localeCompare(b.name)
        : (oppDuration(b) || 0) - (oppDuration(a) || 0),
    )
    .slice(0, 8);
  if (!data.length)
    return emptyHTML(
      "Set a start date on an opportunity to show its duration.",
    );
  const min = Math.min(...data.map((x) => dayStamp(oppStart(x)))),
    max = Math.max(
      dayStamp(todayISO()),
      ...data.map((x) => dayStamp(x.closedDate || todayISO())),
    ),
    span = Math.max(86400000, max - min);
  return `<div class="duration-timeline"><div class="timeline-header"><span>Opportunity</span><span>Duration</span><div>${Array.from({ length: 6 }, (_, i) => `<small>${shortMonth(isoDate(new Date(min + (span * i) / 5 + 12 * 3600000)))}</small>`).join("")}</div></div>${data
    .map(
      (x) =>
        `<div class="duration-row"><button class="record-link" data-profile="Opportunities" data-id="${esc(x.id)}">${esc(x.name)}</button><span>${oppDuration(x)} days</span><div class="duration-track">${stageIntervals(
          x,
        )
          .map((h) => {
            const a = dayStamp(h.start),
              b = dayStamp(h.end || x.closedDate || todayISO());
            if (!Number.isFinite(a) || !Number.isFinite(b)) return "";
            const left = Math.max(0, ((a - min) / span) * 100),
              width = Math.max(0.5, ((b - a) / span) * 100);
            return `<i style="left:${left}%;width:${Math.min(width, 100 - left)}%;background:${STAGE_COLORS[STAGES.indexOf(h.stage)] || PALETTE[0]}" title="${esc(h.stage)}: ${dayDiff(h.start, h.end || todayISO())} days"></i>`;
          })
          .join("")}</div></div>`,
    )
    .join(
      "",
    )}</div><div class="chart-key">${STAGES.map((s, i) => `<span><i style="background:${STAGE_COLORS[i]}"></i>${STAGE_LABELS[i]}</span>`).join("")}</div>`;
}
function averageStageChart(rows) {
  const groups = STAGES.map((stage) => {
    const intervals = rows
      .flatMap((x) =>
        stageIntervals(x)
          .filter((h) => h.stage === stage)
          .map((h) => dayDiff(h.start, h.end || todayISO())),
      )
      .filter((n) => n !== null);
    return [
      STAGE_LABELS[STAGES.indexOf(stage)],
      intervals.length
        ? Math.round(intervals.reduce((s, n) => s + n, 0) / intervals.length)
        : 0,
    ];
  });
  const max = Math.max(1, ...groups.map((g) => g[1]));
  return `<div class="vertical-bars">${groups.map(([label, n], i) => `<div><b>${n}</b><span style="height:${(n / max) * 130}px;background:${STAGE_COLORS[i]}"></span><small>${label}</small></div>`).join("")}</div><p class="chart-footnote">Days per recorded stage interval; unrecorded stages are excluded.</p>`;
}

function calendarHTML(meetings, target = "Meetings") {

      month: "long",

    const d = new Date(anchor);

    );

    days = Array.from(

  return panelHTML(
    month,
    `<div class="calendar-key"><span><i class="green-dot"></i>Meeting / report done</span><span><i class="orange-dot"></i>Report pending</span><span><i class="red-dot"></i>Overdue report</span></div><div class="calendar-grid calendar-${view.toLowerCase()}">${view !== "Day" ? ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map((x) => `<div class="calendar-weekday">${x}</div>`).join("") : ""}${days

function notificationsList() {
  const out = [],
    prefs = userPrefs(),
    now = Date.now();
  for (const m of recordsFor("Meetings", "Notifications"))
    if (
      m.status !== "Cancelled" &&
      meetingEnd(m) <= now &&
      ["Pending", "Overdue"].includes(meetingReportState(m)) &&
      !(prefs["snooze_" + m.id] > now)
    )
      out.push({
        kind: meetingReportState(m) === "Overdue" ? "red" : "orange",
        title: "Meeting report required",
        text: m.name,
        action: `data-meeting-report="${esc(m.id)}"`,
        snooze: m.id,
      });
  const tasks = recordsFor("Tasks", "Notifications").filter(
    (t) => taskStatus(t) === "Overdue",
  );
  if (tasks.length)
    out.push({
      kind: "orange",
      title: tasks.length + " overdue tasks",
      text: "Review follow-up actions",
      action: 'data-notify-task="Overdue"',
    });
  const complaints = recordsFor("Complaints", "Notifications").filter(
    (c) => c.status !== "Resolved",
  );
  if (complaints.length)
    out.push({
      kind: "red",
      title: complaints.length + " complaints require attention",
      text: "Review open concerns",
      action: 'data-page="Complaints"',
    });
  const today = recordsFor("Meetings", "Notifications").filter(
    (m) => m.date === todayISO() && m.status === "Scheduled",
  );
  if (today.length)
    out.push({
      kind: "calm",
      title: today.length + " meetings today",
      text: "View your schedule",
      action: 'data-notify-today="true"',
    });
  const contacts = recordsFor("Contacts", "Notifications");
  let duplicates = 0;
  for (let i = 0; i < contacts.length; i++)
    if (
      findDuplicates(contacts[i], contacts[i].id).some((m) =>
        contacts.slice(i + 1).some((c) => c.id === m.record.id),
      )
    )
      duplicates++;
  if (duplicates)
    out.push({
      kind: "orange",
      title: duplicates + " possible duplicate contacts",
      text: "Review suggested matches",
      action: 'data-duplicate-review="true"',
    });
  return out;
}

async function saveEntity(k, id, draft, after) {
  if (!RECORD_TYPES.includes(k) || !String(draft.name || "").trim())
    return null;
  if (!linksValid(draft)) {
    toast("A linked record is no longer available.");
    return null;
  }
  const old = id ? visibleRecord(k, id) : null;
  if (id && !old) {
    toast("Record no longer available.");
    return null;
  }
  const now = Date.now(),
    allowVisibility =
      isManager() &&
      (!old || old.ownerId === user.id) &&
      ["Contacts", "Opportunities"].includes(k);
  const record = {
    ...old,
    ...draft,
    name: String(draft.name).trim(),
    company: String(draft.company || "").trim(),
    entityType: k,
    id: id || crypto.randomUUID(),
    ownerId: old?.ownerId || user.id,
    visibility: allowVisibility
      ? draft.visibility === "private"
        ? "private"
        : "shared"
      : old?.visibility || "shared",
    createdAt: old ? old.createdAt || null : now,
    updatedAt: now,
    history: [...(old?.history || [])],
  };
  if (old) {
    const { history, ...before } = old;
    record.history.push({ at: now, actorId: user.id, before });
  }
  if (k === "Opportunities") {
    record.stageHistory = structuredClone(
      old?.stageHistory?.length
        ? old.stageHistory
        : old
          ? stageIntervals(old)
          : [],
    );
    if (!old && record.startDate)
      record.stageHistory = [
        { stage: record.status, start: record.startDate, end: "" },
      ];
    if (old && old.status !== record.status) {
      const last = record.stageHistory.at(-1);
      if (last && !last.end) last.end = todayISO();
      record.stageHistory.push({
        stage: record.status,
        start: todayISO(),
        end: "",
      });
      record.lastStageChangedAt = now;
      record.closedDate = ["Won", "Lost"].includes(record.status)
        ? todayISO()
        : "";
    }
    if (["Won", "Lost"].includes(record.status) && !record.closedDate)
      record.closedDate = todayISO();
    if (!record.probability && record.probability !== 0)
      record.probability =
        record.status === "Won"
          ? 100
          : record.status === "Lost"
            ? 0
            : record.status === "Negotiation"
              ? 70
              : record.status === "Proposal"
                ? 50
                : record.status === "Qualification"
                  ? 25
                  : 10;
  }
  const ok = await transact((next) => {
    if (
      old &&
      k === "Contacts" &&
      (normal(old.company) !== normal(record.company) ||
        normal(old.jobTitle) !== normal(record.jobTitle)) &&
      (old.company || old.jobTitle)
    ) {
      const current = next.employmentHistory.find(
        (h) =>
          h.contactId === old.id &&
          !h.endDate &&
          normal(h.company) === normal(old.company) &&
          normal(h.jobTitle) === normal(old.jobTitle),
      );
      if (current) {
        current.endDate = todayISO();
        current.updatedAt = now;
      } else
        next.employmentHistory.push({
          id: crypto.randomUUID(),
          contactId: old.id,
          company: old.company || "",
          jobTitle: old.jobTitle || "",
          department: old.department || "",
          startDate: "",
          endDate: todayISO(),
          notes:
            "Previous role retained when the profile changed. Original start date not recorded.",
          ownerId: old.ownerId,
          visibility: old.visibility,
          createdAt: now,
          updatedAt: now,
        });
    }
    if (id) next[k] = next[k].map((r) => (r.id === id ? record : r));
    else next[k].push(record);
    addLog(next, `${singular(k)} ${id ? "updated" : "added"}`, record, k);
    if (after) after(next, record, old);
  });
  return ok ? db[k].find((r) => r.id === record.id) || null : null;
}

        meetingId: r.meetingId || "",
        reportId: r.id,
        createdAt: prior?.createdAt || Date.now(),
        updatedAt: Date.now(),
        history: prior?.history || [],
      };
      if (prior)
        next.Tasks = next.Tasks.map((t) => (t.id === prior.id ? task : t));
      else {
        next.Tasks.push(task);
        createdActions++;
      }
      addLog(
        next,
        prior ? "Follow-up task updated" : "Follow-up task created",
        task,
        "Tasks",
      );
      return { ...a, taskId: task.id };
    });
    if (r.reportType === "Complaint") {
      const prior = next.Complaints.find((c) => c.reportId === r.id);
      const c = {
        ...prior,
        id: prior?.id || crypto.randomUUID(),
        name: r.name,
        company: r.company,
        status:
          r.status === "Completed"
            ? "Resolved"
            : r.status === "In Progress"
              ? "In Progress"
              : "Open",
        priority: r.priority,
        notes: r.details,
        resolution: r.resolution,
        date: r.followUpDate || r.date,
        reportId: r.id,
        entityType: "Complaints",
        ownerId: prior?.ownerId || r.ownerId,
        visibility: r.visibility,
        contactIds: r.contactIds,
        opportunityId: r.opportunityId,
        createdAt: prior?.createdAt || Date.now(),
        updatedAt: Date.now(),
        history: prior?.history || [],
      };
      if (prior)
        next.Complaints = next.Complaints.map((c2) =>
          c2.id === c.id ? c : c2,
        );
      else {
        next.Complaints.push(c);
        complaintCreated = true;
      }
      addLog(next, "Complaint report linked", c, "Complaints");
      r.complaintId = c.id;
    }
  });

                (createdActions > 1 ? "s" : "") +
                " created",
            ]
          : []),
        ...(complaintCreated ? ["Complaint record created"] : []),
      ]);
  }
}

function similarOpportunities(draft) {
  const words = (s) =>
    new Set(
      normal(s)
        .replace(/[^\p{L}\p{N}\s]/gu, " ")
        .split(/\s+/)
        .filter(
          (x) =>
            x.length > 1 && !["phase", "the", "and", "project"].includes(x),
        ),
    );
  const tokens = words(draft.name);
  return recordsFor("Opportunities", "Linking")
    .map((x) => {
      const other = words(x.name),
        overlap = [...tokens].filter((t) => other.has(t)).length,
        union = new Set([...tokens, ...other]).size,
        nameScore = union ? overlap / union : 0,
        companySame =
          normal(x.company) && normal(x.company) === normal(draft.company);
      return {
        record: x,
        score: Math.round(nameScore * 80 + (companySame ? 20 : 0)),
        nameScore,
      };
    })
    .filter((m) => m.nameScore >= 0.5 && m.score >= 50)
    .sort((a, b) => b.score - a.score);
}

    .join("")}</dl>${[
    ["Discussion Summary", r.summary],
    ["Description", r.details || r.notes],
    ["Key Takeaways", r.keyTakeaways],
    ["Decisions", r.decisions],
    ["Next Steps", r.nextSteps],
    ["Resolution", r.resolution],

          `<p>${esc(t.name)} — ${dateLabel(t.date)} — ${esc(userName(t.assigneeId || t.ownerId))} — ${esc(taskStatus(t))}</p>`,

  download(
    "DGJ-report-" + r.id.slice(0, 8) + ".html",

</script>
  <script>
/* Profile overview, career history, notes and local attachments. */
const relatedSupplement = (row, k, id) =>

}
function linkedCompanyForm(id, companyId) {
  const o = visibleRecord("Opportunities", id);
  if (!o) return;
  const old = o.linkedCompanies?.find((c) => c.id === companyId);
  const d = showDialog(
    `<form id="linked-company-form">${dialogTitle(old ? "Edit Linked Company" : "Link Company", o.name)}${fieldHTML("Company Name", "name", old?.name, "text", true)}${selectHTML("Relationship", "relationship", old?.relationship || "Consultant", ["Client", "Joint Venture Partner", "Consultant", "Contractor", "Developer", "Other"])}${textareaHTML("Notes", "notes", old?.notes)}<div class="formbuttons"><button type="button" class="secondary" data-close>Cancel</button><button class="primary" type="submit">Save Company</button></div></form>`,
  );
  d.classList.add("dialog-medium");
  d.querySelector("form").onsubmit = async (e) => {
    e.preventDefault();
    const v = Object.fromEntries(new FormData(e.target));
    if (!v.name.trim()) return;
    if (normal(v.name) === normal(o.company))
      return toast("This is already the primary company.");
    const record = { ...old, ...v, id: old?.id || crypto.randomUUID() },
      companies = (o.linkedCompanies || []).filter((c) => c.id !== record.id);
    if (companies.some((c) => normal(c.name) === normal(record.name)))
      return toast("That company is already linked.");
    companies.push(record);
    if (
      await saveEntity("Opportunities", id, {
        name: o.name,
        company: o.company,
        linkedCompanies: companies,

}
function supplementReadable(row) {

}
function profileNotes(k, id) {

      : contacts

}
function profileInfo(k, x) {

    ? [

profilePage = function () {

      ? [
          "Overview",
          "Timeline",
          "Company History",
          "Related Contacts",
          "Opportunities",
          "Meetings",
          "Tasks",
          "Reports",
          "Complaints",
          "Communication",
          "Notes",
          "Files",
          "Details",
        ]
      : [

          "Timeline",
          "Contacts",
          "Meetings",
          "Tasks",

function sameCompanyPeople(x) {

function linkedOpportunities(x) {

relatedPeople = function (k, x) {

      x.contactIds?.includes(c.id),
    );

employmentSection = function (id) {

    rows = visibleHistoryRows("Contacts", id).sort((a, b) =>
      (b.startDate || "").localeCompare(a.startDate || ""),

employmentForm = function (id) {
  if (activeProfile?.type !== "Contacts") return;
  const contact = visibleRecord("Contacts", activeProfile.id);
  if (!contact) return;
  const old = id
    ? db.employmentHistory.find(
        (x) => x.id === id && x.contactId === contact.id && linkedAccess(x),
      )
    : null;
  if (id && !old) return;
  const x = old || {};
  const d = showDialog(
    `<form id="position-form">${dialogTitle(old ? "Edit Position" : "Add Position")}<div class="form-grid">${fieldHTML("Company", "company", x.company, "text", true)}${fieldHTML("Position", "jobTitle", x.jobTitle, "text", true)}${fieldHTML("Department", "department", x.department)}${fieldHTML("Start Date", "startDate", x.startDate, "date")}${fieldHTML("End Date (blank for current role)", "endDate", x.endDate, "date")}</div><label class="formfield"><input type="checkbox" name="updateProfile" style="display:inline;width:auto"> Make this the current position on the contact profile</label>${textareaHTML("Notes", "notes", x.notes)}<div class="formbuttons"><button type="button" class="secondary" data-close>Cancel</button><button class="primary" type="submit">Save Position</button></div></form>`,
  );

    e.preventDefault();
    const fd = new FormData(e.target),
      v = Object.fromEntries(fd);
    if (v.endDate && v.startDate && v.endDate < v.startDate)
      return toast("End date cannot precede start date.");
    if (fd.has("updateProfile") && v.endDate)
      return toast("A current position must have no end date.");
    const rec = {
      ...old,
      ...v,
      id: old?.id || crypto.randomUUID(),
      contactId: contact.id,

function parseCSV(text) {
  const lines = [];
  let row = [],
    cell = "",
    quoted = false;
  const s = String(text).replace(/^\uFEFF/, "");
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (c === '"') {
      if (quoted && s[i + 1] === '"') {
        cell += '"';
        i++;
      } else quoted = !quoted;
    } else if (c === "," && !quoted) {
      row.push(cell);
      cell = "";
    } else if ((c === "\n" || c === "\r") && !quoted) {
      if (c === "\r" && s[i + 1] === "\n") i++;
      row.push(cell);
      if (row.some((x) => x.trim())) lines.push(row);
      row = [];
      cell = "";
    } else cell += c;
  }
  if (quoted) throw Error("Unclosed CSV quote");
  row.push(cell);
  if (row.some((x) => x.trim())) lines.push(row);
  return lines;
}

async function commitImport() {
  const d = document.getElementById("modal"),
    selected = [...d.querySelectorAll("[data-import-row]:checked")]
      .map((c) => importRows[Number(c.dataset.importRow)])
      .filter(Boolean);
  if (!selected.length) return toast("Select at least one contact.");
  const invalid = selected.find(
    (x) => !x.name || (x.email && !validEmail(x.email)),
  );
  if (invalid) return toast("Review the contact names and email addresses.");
  const timestamp = Date.now();
  if (
    await transact((next) => {
      for (const input of selected) {
        const x = {
          ...input,
          id: crypto.randomUUID(),
          name: input.name.trim(),
          company: input.company || "",
          entityType: "Contacts",
          status: statuses.Contacts.includes(input.status)
            ? input.status
            : "Active",
          ownerId: user.id,
          visibility: "shared",
          contactIds: [],
          history: [],
          createdAt: timestamp,
          updatedAt: timestamp,
        };
        next.Contacts.push(x);
        addLog(next, "Contact imported", x, "Contacts");
      }
    })
  ) {
    closeDialog();
    page = "Contacts";
    activeProfile = null;
    query = "";
    ui.filters.Contacts = {};
    render();
    toast(selected.length + " contacts imported.");
  }

    ui.sort = {};
    ui.bannerHidden = false;
    document.getElementById("search").value = "";
    document.getElementById("nav").replaceChildren();
    document.getElementById("main").replaceChildren();
    closeDialog();
    document.getElementById("modal").replaceChildren();
    document.getElementById("toast").textContent = "";
    document.getElementById("toast").style.display = "none";
    document.body.classList.add("signed-out");
    document.getElementById("login-shell").hidden = false;
    document.getElementById("login-error").textContent = message;
    document.getElementById("login-form").reset();
    clearAlert();
    document.querySelector(".account span").textContent = "";
    document.querySelector(".account .avatar").textContent = "";
  }
  async function request(path, { method = "GET", body, key } = {}) {
    const epoch = session.epoch,
      headers = { "Content-Type": "application/json" };
    if (session.token) headers.Authorization = "Bearer " + session.token;
    if (key) headers["Idempotency-Key"] = key;
    let res;
    try {
      res = await fetch(apiBase + path, {
        method,
        headers,
        credentials: "omit",
        cache: "no-store",
        ...(body !== undefined ? { body: JSON.stringify(body) } : {}),
      });
    } catch {
      const error = new Error(
        "Connection failed. Check your connection and try again.",
      );
      error.network = true;
      throw error;
    }
    let data;
    try {
      data = await res.json();
    } catch {
      data = {};
    }
    if (epoch !== session.epoch)
      throw Object.assign(new Error("Session changed."), {
        sessionChanged: true,
      });
    if (!res.ok) {
      const error = new Error(
        data.error?.message ||
          data.message ||
          "Unable to complete this request.",
      );
      error.status = res.status;
      error.code = data.error?.code || data.code;
      if (
        session.ready &&
        (res.status === 401 || error.code === "ACCOUNT_DISABLED")
      )
        clearSession("Your session ended. Sign in again.");
      throw error;
    }
    return { data, token: res.headers.get("set-auth-token") };
  }
  async function refresh() {
    if (!session.ready || session.writing || session.pending) return false;
    const epoch = session.epoch,
      priorRevision = revision,
      sequence = ++refreshSequence;
    try {
      setStatus("Refreshing…");
      const result = await request("/api/workspace");
      if (
        epoch !== session.epoch ||
        priorRevision !== revision ||
        sequence !== refreshSequence ||
        session.writing ||
        session.pending
      )
        return false;
      apply(result.data.state);
      clearAlert();
      render();
      return true;
    } catch (error) {
      if (!error.sessionChanged && session.ready) {
        setStatus("Offline · Retry");
        alert(error.message);
      }
      return false;
    }
  }
  function difference(next) {
    const operations = [];
    for (const kind of [...RECORD_TYPES, ...auxiliary]) {
      const prior = new Map(
        (db[kind] || [])
          .filter((r) => kind !== "activity" || r.kind === "interaction")
          .map((r) => [r.id, r]),
      );
      const rows = (next[kind] || []).filter(
        (r) => kind !== "activity" || r.kind === "interaction",
      );
      for (const row of rows) {
        const old = prior.get(row.id);
        prior.delete(row.id);
        const data = bodyOf(kind, row);
        if (!old)
          operations.push({
            kind,
            id: row.id,
            action: "create",
            version: 0,
            data,
          });
        else if (!!old.deletedAt !== !!row.deletedAt)
          operations.push({
            kind,
            id: row.id,
            action: row.deletedAt ? "trash" : "restore",
            version: old.version,
          });
        else if (!same(bodyOf(kind, old), data))
          operations.push({
            kind,
            id: row.id,
            action: "update",
            version: old.version,
            data,
          });
      }
      for (const old of prior.values())
        if (kind !== "activity")
          operations.push({
            kind,
            id: old.id,
            action:
              RECORD_TYPES.includes(kind) && !old.deletedAt ? "trash" : "purge",
            version: old.version,
          });
    }
    const prefs = next.preferences?.[user.id] || {},
      views = (next.savedViews || []).filter((v) => v.ownerId === user.id);
    const payload = { operations };
    if (
      !same(prefs, db.preferences?.[user.id] || {}) ||
      !same(
        views,
        (db.savedViews || []).filter((v) => v.ownerId === user.id),
      )
    )
      payload.preferences = {
        version: db.preferenceVersion || 0,
        prefs,
        views,
      };
    return payload;
  }
  async function commit(payload, key) {
    const epoch = session.epoch;
    revision++;
    session.writing = true;
    setStatus("Saving…");
    const buttons = [
      ...document.querySelectorAll(
        "#modal button[type=submit],#modal .formbuttons .primary",
      ),
    ].filter((b) => !b.disabled);
    buttons.forEach((b) => (b.disabled = true));
    try {
      const result = await request("/api/workspace", {
        method: "POST",
        body: payload,
        key,
      });
      if (epoch !== session.epoch) return false;
      session.pending = null;
      apply(result.data.state);
      clearAlert();
      return true;
    } catch (error) {
      if (epoch !== session.epoch || !session.ready) return false;
      if (error.network || error.status >= 500) {
        session.pending = { payload, key };
        alert(
          "Save confirmation was not received. Retry the same save to avoid duplicates.",
          "pending",
        );
      } else {
        session.pending = null;
        alert(
          error.status === 412
            ? "Another person changed this data. Refresh and review the latest record before saving again."
            : error.message,
        );
        if (error.status === 412) closeDialog();
      }
      setStatus("Save failed");
      toast(error.message);
      return false;
    } finally {
      if (epoch === session.epoch) session.writing = false;
      buttons.forEach((b) => {
        if (b.isConnected) b.disabled = false;
      });
    }
  }
  persist = async function (next) {
    if (!session.ready) return false;
    if (session.writing) {
      toast("A save is already in progress.");
      return false;
    }
    if (session.pending) {
      toast("Retry the pending save before making another change.");
      return false;
    }
    const payload = difference(next);
    if (!payload.operations.length && !payload.preferences) return true;
    return commit(payload, crypto.randomUUID());
  };
  transact = async function (change) {
    const next = structuredClone(db);
    change(next);
    return persist(next);
  };
  async function signIn(event) {
    event.preventDefault();
    const form = event.target,
      button = form.querySelector("button");
    button.disabled = true;
    document.getElementById("login-error").textContent = "";
    session.epoch++;
    try {
      const response = await request("/api/auth/sign-in/email", {
        method: "POST",
        body: {
          email: form.elements.email.value.trim(),
          password: form.elements.password.value,
          rememberMe: false,
        },
      });
      if (!response.token)
        throw new Error("A signed session was not returned.");
      session.token = response.token;
      const [me, team, state] = await Promise.all([
        request("/api/me"),
        request("/api/team"),
        request("/api/workspace"),
      ]);
      user = me.data.user;
      USERS.splice(
        0,
        USERS.length,
        ...team.data.users.map((u) => ({
          ...u,
          initials: u.name
            .split(/\s+/)
            .slice(0, 2)
            .map((n) => n[0])
            .join("")
            .toUpperCase(),
        })),
      );
      if (!USERS.some((u) => u.id === user.id)) USERS.push({ ...user });
      apply(state.data.state);
      session.ready = true;
      form.reset();
      document.body.classList.remove("signed-out");
      document.getElementById("login-shell").hidden = true;
      render();
    } catch (error) {
      clearSession(error.message);
    } finally {
      button.disabled = false;
    }
  }
  async function signOut() {
    const pending = request("/api/auth/sign-out", {
      method: "POST",
      body: {},
    }).catch(() => {});
    clearSession();
    await pending;
  }
  async function accounts() {
    if (!isManager()) return;
    try {
      const result = await request("/api/users");
      const d = showDialog(
        `<h2>Team Accounts</h2><p class="smallnote">Create accounts and manage CRM access.</p><div>${result.data.users.map((u) => `<div class="account-row"><div class="grow"><b>${esc(u.name)}</b><small>${esc(u.email)} · ${esc(u.role)} · ${u.enabled ? "Enabled" : "Disabled"}</small></div>${u.id === user.id ? "" : `<button class="secondary compact" data-account-toggle="${esc(u.id)}" data-enabled="${!u.enabled}">${u.enabled ? "Disable" : "Enable"}</button>`}</div>`).join("")}</div><form id="create-account"><h3>Add Account</h3><div class="form-grid">${fieldHTML("Name", "name", "", "text", true)}${fieldHTML("Email", "email", "", "email", true)}${fieldHTML("Initial Password (12–128 characters)", "password", "", "password", true, 'minlength="12" maxlength="128" autocomplete="new-password"')}${selectHTML("Access", "role", "member", ["member", "manager"])}</div><p class="smallnote">Share initial credentials with the person privately. They can change their password after signing in.</p><div class="formbuttons"><button type="button" class="secondary" data-close>Close</button><button class="primary" type="submit">Create Account</button></div></form>`,
      );
      d.classList.add("dialog-wide");
      d.querySelector("form").onsubmit = async (e) => {
        e.preventDefault();
        const b = e.target.querySelector("button[type=submit]");
        b.disabled = true;
        try {
          await request("/api/users", {
            method: "POST",
            body: Object.fromEntries(new FormData(e.target)),
          });
          const team = await request("/api/team");
          USERS.splice(0, USERS.length, ...team.data.users);
          await accounts();
          toast("Account created.");
        } catch (error) {
          toast(error.message);
          if (b.isConnected) b.disabled = false;
        }
      };
      d.querySelectorAll("[data-account-toggle]").forEach(
        (b) =>
          (b.onclick = async () => {
            b.disabled = true;
            try {
              await request(
                "/api/users/" +
                  encodeURIComponent(b.dataset.accountToggle) +
                  "/access",
                {
                  method: "PATCH",
                  body: { enabled: b.dataset.enabled === "true" },
                },
              );
              const team = await request("/api/team");
              USERS.splice(0, USERS.length, ...team.data.users);
              await accounts();
            } catch (error) {
              toast(error.message);
              b.disabled = false;
            }
          }),
      );
    } catch (error) {
      toast(error.message);
    }
  }
  function changePassword() {
    const d = showDialog(
      `<form id="change-password"><h2>Change Password</h2>${fieldHTML("Current Password", "currentPassword", "", "password", true, 'autocomplete="current-password"')}${fieldHTML("New Password (12–128 characters)", "newPassword", "", "password", true, 'minlength="12" maxlength="128" autocomplete="new-password"')}<div class="formbuttons"><button class="secondary" type="button" data-close>Cancel</button><button class="primary" type="submit">Update Password</button></div></form>`,
    );
    d.querySelector("form").onsubmit = async (e) => {
      e.preventDefault();
      const b = e.target.querySelector("button[type=submit]");
      b.disabled = true;
      try {
        const response = await request("/api/auth/change-password", {
          method: "POST",
          body: {
            ...Object.fromEntries(new FormData(e.target)),
            revokeOtherSessions: true,
          },
        });
        if (response.token) session.token = response.token;
        closeDialog();
        toast("Password changed. Other sessions were signed out.");
      } catch (error) {
        toast(error.message);
        if (b.isConnected) b.disabled = false;
      }
    };
  }
  async function exportedState() {
    if (session.writing || session.pending)
      throw new Error("Finish the current save before exporting.");
    const priorRevision = revision;
    const state = (await request("/api/workspace/export")).data.state;
    if (priorRevision !== revision || session.writing || session.pending)
      throw new Error("Data changed while preparing the export. Try again.");
    return state;
  }
  const oldCsv = csv;
  csv = async function () {
    if (!isManager()) return toast("Only the General Manager can export.");
    try {
      const fresh = await exportedState();
      apply(fresh);
      oldCsv();
    } catch (error) {
      toast(error.message);
    }
  };
  const oldExportReport = exportReport;
  exportReport = async function (id) {
    if (!isManager()) return toast("Only the General Manager can export.");
    try {
      apply(await exportedState());
      oldExportReport(id);
    } catch (error) {
      toast(error.message);
    }
  };
  backupVisibleData = async function () {
    if (!isManager()) return;
    try {
      download(
        "DGJ-CRM-backup.json",
        JSON.stringify(await exportedState(), null, 2),
        "application/json",
      );
      toast("Backup exported.");
    } catch (error) {
      toast(error.message);
    }
  };
  settings = function () {
    return `<div class="pageheading"><h1>Settings</h1></div><div class="settings-account"><section class="panel"><h3>Your Account</h3><p>${esc(user.name)} · ${esc(user.email)}</p><p class="smallnote">${isManager() ? "General Manager" : "Team Member"} · Data is stored in the shared CRM database.</p><div class="account-controls"><button class="secondary" id="real-password">Change Password</button>${isManager() ? '<button class="secondary" id="real-accounts">Team Accounts</button><button class="secondary" id="real-backup">Download Backup</button><label class="secondary">Restore CRM Backup<input id="restore" type="file" accept="application/json,.json" hidden></label>' : ""}<button class="secondary" id="real-signout">Sign Out</button></div></section><section class="panel"><h3>Connection</h3><p>Railway · PostgreSQL</p><p class="smallnote">Saved records are available to authorized teammates. Private records are restricted by the server.</p><button class="secondary" id="real-refresh">Refresh Data</button></section></div>`;
  };
  document.getElementById("login-form").onsubmit = signIn;
  document.addEventListener("click", async (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.id === "real-signout") await signOut();
    if (b.id === "real-accounts") await accounts();
    if (b.id === "real-password") changePassword();
    if (b.id === "real-backup") await backupVisibleData();
    if (
      b.id === "real-refresh" ||
      b.id === "sync-status" ||
      b.hasAttribute("data-refresh-data")
    ) {
      if (document.getElementById("modal").open)
        return toast("Close the form before refreshing.");
      if (session.pending)
        return toast("Retry the pending save before refreshing.");
      await refresh();
    }
    if (b.hasAttribute("data-retry-save") && session.pending) {
      const p = session.pending;
      if (await commit(p.payload, p.key)) {
        closeDialog();
        render();
        toast("Saved successfully.");
      }
    }
  });
  setInterval(() => {
    if (
      document.visibilityState === "visible" &&
      !document.getElementById("modal").open
    )
      refresh();
  }, 45000);
  clearSession();
  return { request, refresh, clearSession, signOut };
})();

</script>
</body>
</html>
